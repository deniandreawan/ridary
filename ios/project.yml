name: Ridary
options:
  bundleIdPrefix: app.ridary
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: NO
    EXTRACT_APP_INTENTS_METADATA: NO
    ENABLE_APPINTENTS_DEPLOYMENT_AWARE_PROCESSING: NO
    CODE_SIGN_STYLE: Automatic

targets:
  Ridary:
    type: application
    platform: iOS
    sources:
      - path: Ridary
      - path: Config/GoogleService-Info.plist
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ridary.ios
        PRODUCT_NAME: Ridary
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Firebase
        product: FirebaseAI
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseRemoteConfig
    scheme:
      testTargets:
        - RidaryTests

  RidaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RidaryTests
    dependencies:
      - target: Ridary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ridary.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
